openreview:
  username: ""
  password: ""
  token: ""

llm:
  # OpenAI-compatible API base URL; replace with your provider's endpoint.
  base_url: https://api.example.com/v1
  # Model identifier supported by the selected API provider.
  model: deepseek-flash
  # Add API key(s) here in your local configs/config.yaml, not in this example.
  api_tokens: []
  per_key_request_interval_seconds: 1.0
  per_key_max_concurrent_requests: 1
  max_retries: 3
  retry_backoff_seconds: 3.0
  temperature: 0.0
  max_tokens: 12000

search:
  provider: semantic_scholar
  max_results: 3
  language: en
  timeout_seconds: 30.0
  min_interval_seconds: 1.0
  max_retries: 5
  retry_backoff_seconds: 4.0
  retry_backoff_multiplier: 2.0
  cache_dir: outputs/search_cache

stages:
  max_concurrent_papers: 1
  summarize:
    include_multimodal_evidence: true
  generate_queries:
    include_multimodal_queries: true
    multimodal_only: false
    # PostgreSQL URL for the ICL exemplar table; the database needs pgvector.
    golden_embedding_db_url: postgresql+psycopg://USER:PASSWORD@HOST:5432/DBNAME
    golden_examples_k: 5
    queries_per_type_view:
      IR:
        motivation: 1
        method: 4
        experiment/result: 3
      QA:
        motivation: 0
        method: 0
        experiment/result: 0
    # Local checkpoint directory or Hugging Face model ID, e.g. BAAI/bge-m3.
    bge_model_path: BAAI/bge-m3
    # Local inference device, e.g. cuda:0 or cpu.
    bge_device: cpu
    # Leave empty to run BGE-M3 locally; set a compatible service URL to use remote embeddings.
    embedding_service_url: ""
    embedding_service_timeout: 120.0
    golden_classifications_path: data/icl/golden_retrieval_icl_examples_ir.json
  query_analysis:
    embedding_analysis:
      enabled: true
      bge_model_path: BAAI/bge-m3
      bge_device: cpu
  hard_negative_mining:
    review_max_workers: 1
    # Direct mode uses the configured LLM unless Flash-to-Pro review is explicitly enabled.
    enable_pro_review: false
